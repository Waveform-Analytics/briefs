<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CNSOER Acoustic Modelling Brief</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}
:root{--bg:#f7f8fa;--surface:#fff;--ink:#0e1116;--ink-2:#4a5563;--rule:#e3e7ec;--accent:#b3287f;--err:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c0f13;--surface:#141920;--ink:#eef2f6;--ink-2:#aab4c0;--rule:#26303b;--accent:#e06ab4;--err:#ff8a80}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c0f13;--surface:#141920;--ink:#eef2f6;--ink-2:#aab4c0;--rule:#26303b;--accent:#e06ab4;--err:#ff8a80}
body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;margin:0;padding-left:16px;padding-right:16px}
#lock{min-height:92vh;display:grid;place-items:center}
.box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:28px 26px;text-align:center}
.sonar{position:relative;width:64px;height:64px;margin:4px auto 18px}
.sonar i{position:absolute;inset:0;border:2px solid var(--accent);border-radius:50%;animation:p 3s cubic-bezier(.2,.6,.3,1) infinite}
.sonar i:nth-child(2){animation-delay:1.5s}
.sonar b{position:absolute;inset:26px;background:var(--accent);border-radius:50%}
@keyframes p{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.sonar i{animation:none;opacity:.3}}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:24px;letter-spacing:-.02em;margin:0 0 6px}
p{color:var(--ink-2);font-size:14.5px;margin:0 0 18px}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;font-size:15px;padding:10px 16px;border-radius:10px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
.msg{min-height:1.4em;font-size:13.5px;margin-top:12px;color:var(--err)}
</style>
</head>
<body>
<div id="lock"><div class="box">
  <div class="sonar" aria-hidden="true"><i></i><i></i><b></b></div>

</div></div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return new TextDecoder().decode(pt);
}
async function mount(html){
  const app = document.getElementById("app");
  app.innerHTML = html;                                   // styles and markup apply as inserted
  document.getElementById("lock").hidden = true;
  window.scrollTo(0, 0);
  // Scripts inserted as HTML do not run, so re-create them in order,
  // waiting for each external one to load before the next.
  for (const old of Array.from(app.querySelectorAll("script"))){
    const s = document.createElement("script");
    if (old.src){ s.src = old.src; await new Promise((ok, no) => { s.onload = ok; s.onerror = no; old.replaceWith(s); }); }
    else { s.textContent = old.textContent; old.replaceWith(s); }
  }
}
async function tryOpen(pw, remember){
  try { const html = await unlock(pw); await mount(html);
    if (remember) try { sessionStorage.setItem("brief-pw", pw); } catch(e){}
    return true; }
  catch(e){ return false; }
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault(); const m = document.getElementById("msg"); m.textContent = "";
  const ok = await tryOpen(document.getElementById("pw").value, true);
  if (!ok){ m.textContent = "That password did not open it. Check it and try again."; document.getElementById("pw").select(); }
});
// Stay open across a republish in the same tab.
(async () => { let saved = null; try { saved = sessionStorage.getItem("brief-pw"); } catch(e){}
  if (saved && !(await tryOpen(saved, false))) try { sessionStorage.removeItem("brief-pw"); } catch(e){}
  if (!saved) document.getElementById("pw").focus(); })();
</script>
